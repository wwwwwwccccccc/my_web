<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  @font-face {
    font-family: 'NotoSerif';
    src: url('../../public/fonts/NotoSerifSC-subset.woff2') format('woff2');
    font-weight: 200 900;
  }
  body { width: 1200px; height: 1450px; background: #080705; }
  .stage { position: absolute; inset: 0; overflow: hidden; background: #080705; }
  .photo {
    position: absolute; inset: 0;
    background-image: url('../stock/packaging-hi.jpg');
    background-size: cover; background-position: 52% 34%;
    filter: sepia(.22) saturate(.62) contrast(1.06) brightness(.72);
    transform: scale(1.02);
  }
  .shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(8,7,5,.72) 0%, rgba(8,7,5,.08) 26%, rgba(8,7,5,.06) 44%, rgba(8,7,5,.72) 78%, rgba(8,7,5,.96) 100%),
      linear-gradient(90deg, rgba(8,7,5,.55) 0%, transparent 52%),
      radial-gradient(circle at 72% 26%, rgba(196,150,96,.18), transparent 55%);
  }
  .frame { position: absolute; inset: 34px; border: 1px solid rgba(236,233,226,.2); pointer-events: none; z-index: 5; }
  .top { position: absolute; left: 64px; right: 64px; top: 58px; display: flex; justify-content: space-between; z-index: 6; }
  .top .meta { color: rgba(240,232,219,.7); }
  .side {
    position: absolute; right: 52px; top: 50%; transform: translateY(-50%) rotate(90deg); transform-origin: center;
    font-size: 11px; letter-spacing: .4em; color: rgba(240,232,219,.45); z-index: 6;
    white-space: nowrap;
  }
  .wordmark {
    position: absolute; left: 60px; top: 760px; z-index: 6;
    font-family: 'NotoSerif', 'Songti SC', serif; font-weight: 300;
    font-size: 250px; line-height: .8; letter-spacing: .04em; color: #f3ead9;
    text-shadow: 0 20px 80px rgba(0,0,0,.55);
  }
  .cn {
    position: absolute; left: 68px; top: 1000px; z-index: 6;
    font-size: 25px; letter-spacing: .48em; color: rgba(243,234,217,.88); font-weight: 300;
  }
  .cn small { display: block; margin-top: 18px; font-size: 11px; letter-spacing: .34em; color: rgba(243,234,217,.5); font-family: 'DIN', sans-serif; }
  .desc {
    position: absolute; left: 68px; top: 1120px; width: 480px; z-index: 6;
    font-size: 14px; line-height: 2; color: rgba(240,232,219,.6); font-weight: 300;
  }
  .seal {
    position: absolute; right: 76px; bottom: 168px; z-index: 6;
    width: 120px; height: 120px; border: 1px solid rgba(240,232,219,.35); border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-size: 9px; letter-spacing: .24em; color: rgba(240,232,219,.65); text-align: center;
  }
  .seal b { font-size: 22px; letter-spacing: .12em; font-weight: 400; color: #f3ead9; font-family: 'NotoSerif', serif; }
  .bottom {
    position: absolute; left: 64px; right: 64px; bottom: 58px; z-index: 6;
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px solid rgba(240,232,219,.18); padding-top: 20px;
  }
  .bottom .tags { display: flex; gap: 34px; }
  .bottom .tags span { font-size: 12px; letter-spacing: .18em; color: rgba(240,232,219,.62); }
  .bottom .idx { font-size: 12px; letter-spacing: .2em; color: rgba(240,232,219,.4); }
  .swatches { position: absolute; right: 76px; top: 240px; display: flex; gap: 8px; z-index: 6; }
  .swatches i { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(240,232,219,.28); display: block; }
</style>
</head>
<body>

</html>
