<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { width: 1800px; height: 1000px; background: #060707; }
  .stage { position: absolute; inset: 0; overflow: hidden; }
  .bg-glow {
    position: absolute; width: 1500px; height: 1100px; left: 780px; top: -200px;
    background: radial-gradient(circle at 50% 50%, rgba(116, 142, 148, .16), transparent 62%);
    filter: blur(30px);
  }
  .grid {
    position: absolute; inset: 0; opacity: .5;
    background-image:
      linear-gradient(rgba(236,233,226,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(236,233,226,.045) 1px, transparent 1px);
    background-size: 120px 120px;
    mask-image: radial-gradient(circle at 68% 40%, #000 10%, transparent 72%);
  }
  .top {
    position: absolute; left: 64px; right: 64px; top: 54px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(236,233,226,.14); padding-bottom: 22px;
  }
  .top .left { display: flex; gap: 26px; align-items: center; }
  .mark { width: 9px; height: 9px; background: #c6ff4a; border-radius: 50%; }
  .frame { position: absolute; inset: 26px; border: 1px solid rgba(236,233,226,.08); pointer-events: none; }

  .orb-wrap { position: absolute; width: 700px; height: 700px; left: 990px; top: 120px; }
  .orb {
    position: absolute; inset: 40px; border-radius: 50%;
    background:
      radial-gradient(circle at 31% 24%, rgba(255,255,255,.98) 0%, rgba(255,255,255,.15) 13%, transparent 30%),
      radial-gradient(circle at 70% 76%, rgba(180,204,209,.55) 0%, transparent 38%),
      radial-gradient(circle at 50% 50%, transparent 48%, rgba(0,0,0,.55) 72%, rgba(0,0,0,.95) 100%),
      conic-gradient(from 205deg,
        #080909 0deg, #2b3032 38deg, #9aa5a6 74deg, #e7e2d6 92deg,
        #5d6668 118deg, #101213 150deg, #3c4344 196deg, #c9c4b9 226deg,
        #565e60 250deg, #0b0d0e 286deg, #222728 326deg, #080909 360deg);
    box-shadow:
      inset -70px -90px 170px rgba(0,0,0,.92),
      inset 35px 28px 110px rgba(255,255,255,.14),
      0 70px 180px rgba(0,0,0,.85);
    filter: contrast(1.04) saturate(.8);
  }
  .orb::before {
    content: ''; position: absolute; inset: 14%; border-radius: 50%;
    background:
      radial-gradient(circle at 40% 32%, rgba(255,255,255,.22), transparent 42%),
      radial-gradient(circle at 50% 52%, rgba(10,12,12,.72), transparent 64%);
    filter: blur(18px);
  }
  .orb::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 20deg, transparent 0deg, rgba(255,255,255,.16) 24deg, transparent 58deg, transparent 300deg, rgba(255,255,255,.1) 330deg, transparent 360deg);
    filter: blur(10px); mix-blend-mode: screen;
  }
  .ring { position: absolute; left: 50%; top: 50%; border: 1px solid rgba(236,233,226,.16); border-radius: 50%; }
  .ring.a { width: 860px; height: 300px; transform: translate(-50%,-50%) rotate(-17deg); }
  .ring.b { width: 780px; height: 640px; transform: translate(-50%,-50%) rotate(24deg); border-color: rgba(236,233,226,.07); }
  .ring.c { width: 620px; height: 620px; transform: translate(-50%,-50%); border-color: rgba(198,255,74,.18); border-style: dashed; }
  .satellite {
    position: absolute; width: 11px; height: 11px; border-radius: 50%;
    background: #c6ff4a; left: 1110px; top: 218px;
    box-shadow: 0 0 24px rgba(198,255,74,.7);
  }
  .orb-label {
    position: absolute; left: 1360px; top: 760px; text-align: right;
    font-size: 12px; letter-spacing: .24em; color: rgba(236,233,226,.42); line-height: 2;
  }

  .title-block { position: absolute; left: 62px; top: 300px; width: 900px; }
  .kicker { display: flex; align-items: center; gap: 14px; margin-bottom: 34px; }
  .kicker .line { width: 54px; height: 1px; background: rgba(236,233,226,.3); }
  .h1 {
    font-size: 330px; line-height: .78; font-weight: 700; letter-spacing: -.055em;
    color: #f1eee7; margin-left: -18px;
  }
  .h1 .outline {
    color: transparent; -webkit-text-stroke: 1.5px rgba(236,233,226,.45);
  }
  .sub {
    margin-top: 42px; display: flex; gap: 44px; align-items: flex-end;
  }
  .sub .desc { max-width: 430px; font-size: 17px; line-height: 1.9; color: rgba(236,233,226,.6); font-weight: 300; }
  .sub .desc b { color: #ece9e2; font-weight: 500; }
  .sub .spec { font-size: 12px; letter-spacing: .22em; color: rgba(236,233,226,.38); line-height: 2.1; }

  .bottom {
    position: absolute; left: 64px; right: 64px; bottom: 52px;
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px solid rgba(236,233,226,.14); padding-top: 20px;
  }
  .bottom .tags { display: flex; gap: 38px; }
  .bottom .tags span { font-size: 13px; letter-spacing: .16em; color: rgba(236,233,226,.55); }
  .bottom .idx { font-size: 13px; letter-spacing: .2em; color: rgba(236,233,226,.38); }
</style>
</head>
<body>

      <div class="spec">
        STRATEGY<br>VISUAL IDENTITY<br>MOTION SYSTEM

    </div>
  </div>

  <div class="bottom">
    <div class="tags">
      <span>鍝佺墝绛栫暐</span><span>瑙嗚璇嗗埆</span><span>鍔ㄦ€佺郴缁?/span>

</div>
<div class="grain"></div>
</body>
</html>
